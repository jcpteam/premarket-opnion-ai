version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: prediction-market-postgres
    environment:
      POSTGRES_DB: prediction_market
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - prediction-market-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d prediction_market"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: prediction-market-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - prediction-market-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile.prod
    container_name: prediction-market-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/prediction_market
      REDIS_URL: redis://redis:6379
      JWT_SECRET: k8sP2mXvQ7rT9wLzA4nE6jH1cF3gY5dB0uI8oR2xW4vN7mK9qS6tJ3pZ1aD5fG
      PORT: 3001
      FRONTEND_URL: http://16.171.76.19:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - prediction-market-network
    restart: unless-stopped

  # Frontend Web App
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile.prod
    container_name: prediction-market-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://16.171.76.19:3001
      NEXT_PUBLIC_WS_URL: ws://16.171.76.19:3001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - prediction-market-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  prediction-market-network:
    driver: bridge
